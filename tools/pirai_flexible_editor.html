<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://piraiai.com/logo.png" type="image/png">
<link rel="apple-touch-icon" href="https://piraiai.com/logo.png">
<title>Pirai AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F5F6F3;
    --panel:#FFFFFF;
    --border:#E1E4DE;
    --border-strong:#C9CEC5;
    --text:#1B1F1D;
    --muted:#6B7168;
    --forest:#9B6BFF;
    --forest-strong:#7C4DFF;
    --forest-soft:#F1EEFE;
    --amber:#B5732E;
    --amber-soft:#F5EBDD;
    --slate:#586158;
    --slate-soft:#EEF0EC;
    --danger:#B4483C;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:14px; line-height:1.45;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; background:var(--panel); border-bottom:1px solid var(--border);
  }
  header h1{
    font-family:var(--display); font-size:16px; margin:0; letter-spacing:.1px; font-weight:700;
  }
  header h1 span{ color:var(--forest); }
  header .sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  header .logo-mark{
    display:inline-flex; align-items:center; justify-content:center; margin-right:8px; vertical-align:middle;
  }
  header .logo-mark img{ height:24px; width:auto; display:block; }
  header .actions button{ margin-left:8px; }

  .layout{
    display:grid; grid-template-columns: 250px 1fr 5px 400px; gap:0; height:calc(100vh - 61px);
    transition: grid-template-columns .22s ease;
  }
  .layout.no-transition{ transition:none; }
  .col{ overflow-y:auto; overscroll-behavior:contain; }

  /* Minimal scrollbars — invisible until you hover the panel, then a thin thumb blends in */
  .col, .sidebar-scroll, .mini-list{
    scrollbar-width:thin; scrollbar-color:transparent transparent;
  }
  .col:hover, .sidebar-scroll:hover, .mini-list:hover{
    scrollbar-color:var(--border-strong) transparent;
  }
  .col::-webkit-scrollbar, .sidebar-scroll::-webkit-scrollbar, .mini-list::-webkit-scrollbar{
    width:7px;
  }
  .col::-webkit-scrollbar-track, .sidebar-scroll::-webkit-scrollbar-track, .mini-list::-webkit-scrollbar-track{
    background:transparent;
  }
  .col::-webkit-scrollbar-thumb, .sidebar-scroll::-webkit-scrollbar-thumb, .mini-list::-webkit-scrollbar-thumb{
    background:transparent; border-radius:20px; transition:background .15s;
  }
  .col:hover::-webkit-scrollbar-thumb, .sidebar-scroll:hover::-webkit-scrollbar-thumb, .mini-list:hover::-webkit-scrollbar-thumb{
    background:var(--border-strong);
  }
  .col::-webkit-scrollbar-thumb:hover, .sidebar-scroll::-webkit-scrollbar-thumb:hover, .mini-list::-webkit-scrollbar-thumb:hover{
    background:var(--slate);
  }
  .resizer{
    cursor:col-resize; background:var(--border); position:relative;
  }
  .resizer::after{
    content:''; position:absolute; top:0; bottom:0; left:-3px; right:-3px; /* wider hit area */
  }
  .resizer:hover, .resizer.dragging{ background:var(--forest); }
  .sidebar{
    background:var(--panel); border-right:1px solid var(--border); padding:0; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .sidebar-fixed{ padding:14px 14px 12px 14px; flex-shrink:0; border-bottom:1px solid var(--border); }
  .sidebar-scroll{ flex:1; overflow-y:auto; overscroll-behavior:contain; padding:12px 14px 14px 14px; }

  .sidebar-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .mini-collapse-btn, .mini-expand-btn{
    width:24px; height:24px; border-radius:6px; border:1px solid var(--border-strong); background:#fff;
    color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .mini-collapse-btn:hover, .mini-expand-btn:hover{ border-color:var(--forest); color:var(--forest); background:var(--forest-soft); }
  .mini-collapse-btn .icon, .mini-expand-btn .icon{ margin-right:0; }
  .mini-expand-btn{ margin-bottom:12px; transform:rotate(180deg); }

  .sidebar-mini{ display:flex; flex-direction:column; align-items:center; height:100%; padding:10px 0; }
  .mini-add-btn{
    width:32px; height:32px; border-radius:8px; border:1px dashed var(--border-strong); background:transparent;
    color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    margin-bottom:10px;
  }
  .mini-add-btn:hover{ border-color:var(--forest); color:var(--forest); }
  .mini-add-btn .icon{ margin-right:0; }
  .mini-list{ flex:1; overflow-y:auto; overscroll-behavior:contain; width:100%; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .mini-qcard{
    font-family:var(--mono); font-size:9.5px; font-weight:650; color:var(--muted); background:#fff;
    border:1px solid var(--border); border-radius:6px; padding:5px 3px; cursor:pointer; text-align:center;
    width:42px; writing-mode:horizontal-tb; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .mini-qcard:hover{ border-color:var(--border-strong); color:var(--text); }
  .mini-qcard.active{ border-color:var(--forest); background:var(--forest-soft); color:var(--forest); }

  .block-group{ margin-bottom:10px; }
  .block-header{
    display:flex; align-items:center; gap:6px; cursor:pointer; padding:4px 2px; user-select:none;
    font-family:var(--display); font-size:10.5px; text-transform:uppercase; letter-spacing:.07em;
    font-weight:700; color:var(--slate);
  }
  .block-header:hover{ color:var(--forest); }
  .block-chevron .icon{ margin-left:0 !important; margin-right:5px !important; width:10px !important; height:10px !important; transition:transform .15s; }
  .block-chevron.collapsed .icon{ transform:rotate(-90deg); }
  .block-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .block-count{ font-family:var(--mono); font-weight:400; color:var(--muted); text-transform:none; letter-spacing:0; }
  .block-questions{
    margin-left:5px; padding-left:11px; border-left:1.5px dotted var(--border-strong); margin-top:4px;
  }
  .block-questions.collapsed{ display:none; }
  .block-header{ border-radius:5px; }
  .block-header.dragover-block{ background:var(--forest-soft); outline:1.5px dashed var(--forest); }
  .block-grip{ color:var(--border-strong); flex-shrink:0; cursor:grab; display:inline-flex; }
  .block-grip .icon-grip{ width:9px; height:13px; margin-right:0; vertical-align:-2px; }
  .empty-block-header{ cursor:default; }
  .empty-block-header .block-name{ outline:none; border-bottom:1px dashed transparent; }
  .empty-block-header .block-name:focus{ border-bottom-color:var(--forest); }
  .block-questions-empty{ padding:4px 0; }
  .block-questions-empty.dragover{ background:var(--forest-soft); border-radius:6px; }
  .block-questions-empty .lane-empty{ padding:10px 4px; font-size:11px; }
  .sidebar h2, .rightcol h2{
    font-family:var(--display); font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
    margin:0 0 10px 0; font-weight:700;
  }
  .qcard{
    border:1px solid var(--border); border-radius:8px; padding:9px 10px 9px 30px; margin-bottom:7px;
    cursor:pointer; background:var(--panel); transition:.12s; position:relative;
  }
  .qcard:hover{ border-color:var(--border-strong); }
  .qcard.active{ border-color:var(--forest); background:var(--forest-soft); }
  .qcard.qselected{ box-shadow: inset 3px 0 0 var(--forest); }
  .qcard.dragover-q{ border-top:2px solid var(--forest); }
  .qcard .qselbox{
    position:absolute; left:9px; top:11px; width:13px; height:13px; border:1.5px solid var(--border-strong);
    border-radius:3px; cursor:pointer; background:#fff;
  }
  .qcard.qselected .qselbox{ background:var(--forest); border-color:var(--forest); }
  .qcard .qid{ font-family:var(--mono); font-size:11px; color:var(--forest); font-weight:650; }
  .qcard .qtype{ font-family:var(--mono); font-size:10px; color:var(--muted); float:right; }
  .qcard .qtext{ font-size:12.5px; margin-top:3px; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .add-q-btn{
    width:100%; padding:8px; border:1px dashed var(--border-strong); background:transparent;
    color:var(--muted); border-radius:8px; cursor:pointer; font-size:12px; margin-top:4px;
    display:flex; align-items:center; justify-content:center;
  }
  .add-q-btn:hover{ border-color:var(--forest); color:var(--forest); }
  .add-q-btn.primary-add{
    border:1px solid var(--forest-strong); background:linear-gradient(135deg, var(--forest), var(--forest-strong));
    color:#fff; margin-top:0; font-weight:650;
  }
  .add-q-btn.primary-add:hover{ background:var(--forest-strong); color:#fff; }
  .add-q-btn.primary-add .icon{ margin-right:5px; }
  .sidebar-shortcuts{ display:flex; flex-direction:column; gap:5px; margin-top:8px; }
  .add-q-btn.small-shortcut{
    font-size:11px; padding:6px; color:var(--muted); border-style:solid; border-color:var(--border);
    background:#FBFCFA; margin-top:0;
  }
  .add-q-btn.small-shortcut:hover{ border-color:var(--forest); color:var(--forest); background:var(--forest-soft); }
  .add-q-btn.small-shortcut .icon{ width:11px; height:11px; }
  .q-bulk-toolbar{
    margin-top:10px; background:#fff; border:1px solid var(--forest); border-radius:8px; padding:8px 10px;
    display:flex; align-items:center; gap:8px; font-size:12px;
  }
  .q-bulk-toolbar strong{ color:var(--forest); }
  .q-bulk-toolbar .spacer{ flex:1; }
  .q-bulk-toolbar .headbtn{ display:inline-flex; align-items:center; }
  .q-bulk-toolbar .headbtn .icon{ margin-right:0; }

  .main{ padding:20px 26px; }
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px 20px; margin-bottom:16px;
  }
  label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:650; display:block; margin-bottom:5px;}
  input[type=text], textarea, select{
    width:100%; padding:8px 10px; border:1px solid var(--border-strong); border-radius:6px;
    font-family:var(--sans); font-size:13.5px; background:#FDFDFC; color:var(--text);
  }
  textarea{ resize:vertical; min-height:56px; font-family:var(--mono); font-size:12.5px; }
  .row{ display:flex; gap:14px; }
  .row > div{ flex:1; }
  .field{ margin-bottom:12px; }
  .field-error{ color:var(--danger); font-size:11px; margin-top:5px; font-weight:600; }

  button{
    font-family:var(--sans); font-size:12.5px; border-radius:6px; border:1px solid var(--border-strong);
    background:var(--panel); color:var(--text); padding:7px 12px; cursor:pointer; font-weight:600;
  }
  button:hover{ border-color:var(--forest); color:var(--forest); }
  button.primary{ background:linear-gradient(135deg, var(--forest), var(--forest-strong)); border-color:var(--forest-strong); color:#fff; }
  button.primary:hover{ background:var(--forest-strong); color:#fff; }
  button.ghost{ border:1px solid transparent; color:var(--muted); }
  button.small{ padding:4px 8px; font-size:11px; }
  button.danger:hover{ border-color:var(--danger); color:var(--danger); }

  .lanes{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; margin-top:6px; }
  .lanes-flat{ display:grid; grid-template-columns: minmax(210px,300px) 1fr; gap:12px; margin-top:6px; min-width:0; }
  .lane{
    border:1.5px dashed var(--border-strong); border-radius:8px; padding:10px; min-height:170px;
    background:#FBFCFA; transition:.12s; min-width:0; overflow-x:hidden;
  }
  .lane.pool{ border-color:var(--slate); }
  .lane.statements{ border-color:var(--forest); }
  .lane.scale{ border-color:var(--amber); }
  .lane.dragover{ background:#F0F4EF; transform:scale(1.01); }
  .lane .lane-head{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:5px 0;
  }
  .lane.pool .lane-head{ color:var(--slate); }
  .lane.statements .lane-head{ color:var(--forest); }
  .lane.scale .lane-head{ color:var(--amber); }
  .lane-count{ font-family:var(--mono); font-weight:400; color:var(--muted); }

  .item{
    background:#fff; border:1px solid var(--border); border-radius:6px; padding:7px 9px; margin-bottom:6px;
    cursor:grab; font-size:12.5px; display:flex; align-items:center; gap:6px; min-width:0;
  }
  .item:active{ cursor:grabbing; }
  .item.dragging{ opacity:.35; }
  .item .grip{ color:var(--border-strong); font-size:11px; user-select:none; flex-shrink:0; }
  .item .itext{
    flex:1; outline:none; min-width:0; overflow-wrap:break-word; word-break:break-word;
    white-space:pre-wrap;
  }
  .item .irecode{
    font-family:var(--mono); font-size:10.5px; color:#fff; background:var(--slate);
    border-radius:4px; padding:1px 6px; min-width:18px; text-align:center; flex-shrink:0;
  }
  .lane.statements .item .irecode{ background:var(--forest); }
  .lane.scale .item .irecode{ background:var(--amber); }
  .icon{ width:13px; height:13px; display:inline-block; vertical-align:-2px; margin-right:4px; flex-shrink:0; }
  .item .rm .icon, .item .dup .icon, .item .promote .icon, .item-adv-toggle .icon, .chip-skip .icon{ margin-right:0; width:12px; height:12px; vertical-align:-2px; }
  .grip .icon-grip{ width:12px; height:16px; margin-right:0; vertical-align:-4px; }
  .item .rm{ color:var(--border-strong); cursor:pointer; font-size:13px; padding:0 2px; flex-shrink:0;}
  .item .rm:hover{ color:var(--danger); }
  .item .dup{ color:var(--border-strong); cursor:pointer; font-size:12px; padding:0 2px; flex-shrink:0;}
  .item .dup:hover{ color:var(--forest); }
  .item .promote{ color:var(--border-strong); cursor:pointer; font-size:12px; padding:0 2px; flex-shrink:0;}
  .item .promote:hover{ color:var(--forest); }
  .lane-empty{ font-size:11.5px; color:var(--muted); text-align:center; padding:20px 4px; }

  .optlist .item{ cursor:default; }
  .optlist .item .grip{ cursor:grab; }

  .toolrow{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }

  .rightcol{ background:var(--panel); border-left:1px solid var(--border); padding:16px; }
  .rightcol .hint{ font-size:11.5px; color:var(--muted); margin-bottom:12px; }
  table.excel{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:10px; }
  table.excel th{ background:var(--slate-soft); text-align:left; padding:4px 5px; border:1px solid var(--border); position:sticky; top:0; }
  table.excel td{ padding:4px 5px; border:1px solid var(--border); vertical-align:top; word-break:break-word; }
  table.excel tr.hdrow td{ background:#FAFBF9; font-weight:650; }
  table.excel tr.stmt td{ color:var(--forest); }
  table.excel tr.scale td{ color:var(--amber); }

  .badge{ display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px; font-weight:650; }
  .badge.matrix{ background:var(--forest-soft); color:var(--forest); }
  .badge.mc{ background:var(--slate-soft); color:var(--slate); }
  .badge.te{ background:var(--amber-soft); color:var(--amber); }

  .mixmatch{ display:flex; gap:8px; align-items:center; margin-top:8px; }
  .mixmatch select{ flex:1; }

  /* mode toggle */
  .modeToggle{
    display:inline-flex; border:1px solid var(--border-strong); border-radius:7px; overflow:hidden; margin-left:10px;
  }
  .modeToggle button{
    border:none; border-radius:0; background:var(--panel); padding:6px 12px; font-size:11.5px;
  }
  .modeToggle button.on{ background:var(--forest); color:#fff; }
  .modeToggle button:hover{ color:var(--forest); }
  .modeToggle button.on:hover{ color:#fff; }

  /* advanced props */
  .adv-panel{ margin-top:4px; }
  .adv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
  .adv-grid .full{ grid-column:1/-1; }
  select.yn{ width:auto; min-width:90px; }

  .item-adv-toggle{ color:var(--muted); cursor:pointer; font-size:12px; padding:0 2px; flex-shrink:0; }
  .item-adv-toggle:hover{ color:var(--forest); }
  .item-adv{
    display:none; grid-template-columns:1fr auto auto; gap:8px; align-items:center;
    background:#FAFBF9; border:1px solid var(--border); border-radius:6px; padding:6px 8px; margin:-2px 0 8px 24px;
  }
  .item-adv.open{ display:grid; }
  .item-adv input[type=text]{ padding:5px 7px; font-size:11.5px; }
  .item-adv label.chk{ display:flex; align-items:center; gap:4px; font-size:10.5px; text-transform:none; letter-spacing:0; color:var(--muted); font-weight:500; white-space:nowrap; }

  .downloadMenu{ position:relative; display:inline-block; }
  .downloadMenu-list{
    display:none; position:absolute; top:calc(100% + 6px); left:0; min-width:230px; z-index:60;
    background:#fff; border:1px solid var(--border-strong); border-radius:8px; box-shadow:0 8px 20px rgba(0,0,0,.10);
    overflow:hidden;
  }
  .downloadMenu-list.open{ display:block; }
  .downloadMenu-item{
    padding:9px 12px; cursor:pointer; font-size:12.5px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .downloadMenu-item:last-child{ border-bottom:none; }
  .downloadMenu-item:hover{ background:var(--forest-soft); color:var(--forest); }
  .downloadMenu-hint{ font-size:10.5px; color:var(--muted); }
  .downloadMenu-item:hover .downloadMenu-hint{ color:var(--forest); }

  .col15-only{ display:none; }
  body.mode-15 .col15-only{ display:block; }
  body.mode-15 .item-adv-toggle{ display:inline; }
  .item-adv-toggle{ display:none; }

  /* multi-select + marquee */
  .lanesWrap{ position:relative; user-select:none; }
  .item{ position:relative; }
  .selbox{
    width:13px; height:13px; border:1.5px solid var(--border-strong); border-radius:3px; flex-shrink:0; cursor:pointer;
  }
  .item.selected{ outline:2px solid var(--forest); outline-offset:-1px; background:var(--forest-soft); }
  .item.dragover-item{ border-top:2px solid var(--forest); }
  .item.selected .selbox{ background:var(--forest); border-color:var(--forest); }
  .marquee-box{
    position:absolute; border:1px solid var(--forest); background:rgba(123,92,250,.09); pointer-events:none; z-index:40;
  }

  .lane-head .headbtns{ display:flex; gap:4px; }
  .headbtn{
    font-size:9px; padding:2px 5px; border:1px solid var(--border-strong); border-radius:4px; background:#fff;
    cursor:pointer; color:var(--muted); font-weight:600;
  }
  .headbtn:hover{ border-color:var(--forest); color:var(--forest); }

  .bulk-toolbar{
    position:sticky; bottom:8px; margin-top:10px; background:#fff; border:1px solid var(--forest);
    box-shadow:0 4px 14px rgba(0,0,0,.08); border-radius:8px; padding:9px 12px; display:flex; align-items:center;
    gap:10px; font-size:12px; flex-wrap:wrap;
  }
  .bulk-toolbar strong{ color:var(--forest); }
  .bulk-toolbar .spacer{ flex:1; }

  .carve-toolbar{ display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .carve-toolbar select{ width:auto; flex:0 0 170px; }
  .carve-hint{ font-size:11px; color:var(--muted); margin-top:4px; }

  .suggest-hint{ font-size:11.5px; color:var(--muted); margin-top:8px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--border-strong);
    border-radius:20px; padding:4px 6px 4px 4px; font-size:12px;
  }
  .chip.selected{ outline:2px solid var(--forest); outline-offset:-1px; background:var(--forest-soft); }
  .chip .selbox{ margin-left:2px; }
  .chip-text{ max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip-recode{
    font-family:var(--mono); font-size:10px; color:#fff; background:var(--slate); border-radius:10px;
    padding:1px 6px;
  }
  .chip-add, .chip-skip{
    width:19px; height:19px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:11px; font-weight:700; flex-shrink:0;
  }
  .chip-add{ background:var(--forest-soft); color:var(--forest); }
  .chip-add:hover{ background:var(--forest); color:#fff; }
  .chip-skip{ color:var(--border-strong); }
  .chip-skip:hover{ background:#FBEAE8; color:var(--danger); }

  .manual-carve{ display:none; margin-top:8px; }
  .manual-carve.open{ display:block; }

  .broadcast-panel{
    margin-top:10px; border:1px solid var(--border-strong); border-radius:8px; padding:10px 12px; background:#FAFBF9; display:none;
  }
  .broadcast-panel.open{ display:block; }
  .bc-list{ display:flex; flex-direction:column; gap:5px; max-height:130px; overflow-y:auto; margin:8px 0; }
  .bc-list label{ display:flex; gap:6px; align-items:center; font-size:12px; text-transform:none; font-weight:500; color:var(--text); }

  /* survey preview */
  .preview-empty{ font-size:12.5px; color:var(--muted); padding:20px 4px; }
  .preview-card{
    background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px;
    min-width:0; overflow-wrap:break-word; word-break:break-word;
  }
  .preview-card.active{ border-color:var(--forest); box-shadow:0 0 0 1px var(--forest); }
  .preview-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .preview-qid{
    font-family:var(--mono); font-size:11px; font-weight:700; color:var(--forest); background:var(--forest-soft);
    border-radius:5px; padding:2px 7px; flex-shrink:0;
  }
  .preview-type{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:650; flex-shrink:0; }
  .preview-edit{
    margin-left:auto; font-size:10.5px; font-weight:650; padding:3px 9px; border-radius:20px;
    border:1px solid var(--border-strong); background:#fff; color:var(--muted); cursor:pointer; flex-shrink:0;
  }
  .preview-edit:hover{ border-color:var(--forest); color:var(--forest); }
  .preview-edit.is-active{ border-color:var(--forest); background:var(--forest-soft); color:var(--forest); }
  .preview-question-text{
    font-size:14px; font-weight:650; margin-bottom:12px; line-height:1.4;
    overflow-wrap:break-word; word-break:break-word; white-space:pre-wrap;
  }
  .preview-db{ font-size:13px; color:var(--text); line-height:1.6; overflow-wrap:break-word; word-break:break-word; white-space:pre-wrap; }
  .preview-pagebreak{
    text-align:center; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em;
    padding:14px 0; border-top:1px dashed var(--border-strong); border-bottom:1px dashed var(--border-strong);
  }
  .preview-options{ display:flex; flex-direction:column; gap:9px; min-width:0; }
  .preview-options.horizontal{ flex-direction:row; flex-wrap:wrap; gap:16px; }
  .preview-opt{
    display:flex; align-items:center; gap:8px; font-size:13px; cursor:default; text-transform:none;
    letter-spacing:normal; font-weight:400; color:var(--text); min-width:0;
  }
  .preview-opt span:last-child{ min-width:0; overflow-wrap:break-word; word-break:break-word; white-space:pre-wrap; }
  .preview-radio, .preview-check{
    width:15px; height:15px; border:1.5px solid var(--border-strong); flex-shrink:0; display:inline-block;
  }
  .preview-radio{ border-radius:50%; }
  .preview-check{ border-radius:4px; }
  .preview-matrix-wrap{ overflow-x:auto; }
  table.preview-matrix{ border-collapse:collapse; font-size:12px; width:100%; table-layout:fixed; }
  table.preview-matrix th, table.preview-matrix td{ padding:7px 10px; text-align:center; border-bottom:1px solid var(--border); overflow-wrap:break-word; word-break:break-word; }
  table.preview-matrix th{ font-weight:650; color:var(--muted); font-size:11px; }
  table.preview-matrix td:first-child, table.preview-matrix th:first-child{ text-align:left; font-weight:500; color:var(--text); width:36%; }
  .preview-matrix .preview-radio{ margin:0 auto; }
  .preview-input, .preview-textarea{
    border:1px solid var(--border-strong); border-radius:6px; background:#FBFCFA;
  }
  .preview-input{ height:34px; }
  .preview-input.small{ height:30px; width:60%; }
  .preview-textarea{ height:70px; }
  .preview-form-row{ margin-bottom:10px; }
  .preview-form-row label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; text-transform:none; letter-spacing:normal; font-weight:400; overflow-wrap:break-word; word-break:break-word; }
  .preview-list{ display:flex; flex-direction:column; gap:8px; min-width:0; }
  .preview-rank-item{ display:flex; align-items:center; gap:8px; font-size:13px; background:#FBFCFA; border:1px solid var(--border); border-radius:6px; padding:7px 10px; min-width:0; }
  .preview-rank-item span:last-child{ min-width:0; overflow-wrap:break-word; word-break:break-word; }
  .rank-num{
    font-family:var(--mono); font-size:11px; font-weight:700; color:#fff; background:var(--slate);
    border-radius:50%; width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .preview-sum-item{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; min-width:0; }
  .preview-sum-item span:first-child{ min-width:0; overflow-wrap:break-word; word-break:break-word; }
  .preview-sum-box{
    font-family:var(--mono); font-size:12px; border:1px solid var(--border-strong); border-radius:5px;
    padding:3px 10px; background:#FBFCFA; color:var(--muted); min-width:36px; text-align:center;
  }
  .preview-footer{ margin-top:14px; padding-top:10px; border-top:1px solid var(--border); font-size:11px; color:var(--muted); }
</style>
</head>
<body>

<header>
  <div>
    <h1><span class="logo-mark"><img src="https://piraiai.com/logo.png" alt="Pirai AI"></span>Pirai <span>AI</span> Studio</h1>
    <div class="sub">The complete workspace for refining AI-generated surveys.</div>
  </div>
  <div class="actions" style="display:flex; align-items:center;">
    <span style="font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; font-weight:650;">Spec</span>
    <div class="modeToggle">
      <button id="modeBtn7" class="on" onclick="setMode(7)">7‑column</button>
      <button id="modeBtn15" onclick="setMode(15)">15‑column</button>
    </div>
    <button class="ghost small" id="uploadExcelBtn" onclick="document.getElementById('excelUpload').click()">Upload Excel</button>
    <input type="file" id="excelUpload" accept=".xlsx,.xls" style="display:none" onchange="handleExcelUpload(event)">
    <div class="downloadMenu" id="downloadMenu" style="margin-left:8px;">
      <button class="ghost small" id="downloadBtnMain" onclick="toggleDownloadMenu()">Download</button>
      <div class="downloadMenu-list" id="downloadMenuList">
        <div class="downloadMenu-item" onclick="downloadXlsx(7); toggleDownloadMenu(false)">
          <span>7‑column .xlsx</span><span class="downloadMenu-hint">standard spec</span>
        </div>
        <div class="downloadMenu-item" onclick="downloadXlsx(15); toggleDownloadMenu(false)">
          <span>15‑column .xlsx</span><span class="downloadMenu-hint">with logic &amp; properties</span>
        </div>
      </div>
    </div>
    <button class="primary" onclick="saveAll()">Save</button>
  </div>
</header>

<div class="layout" id="layoutGrid">
  <div class="col sidebar" id="sidebar"></div>
  <div class="col main" id="main"></div>
  <div class="resizer" id="resizer" title="Drag to resize"></div>
  <div class="col rightcol">
    <h2>Survey Preview</h2>
    <div class="hint">Scroll through the whole survey. Click Edit on any question to jump to it in the canvas.</div>
    <div id="surveyPreview"></div>
  </div>
</div>

<script>
// ---------- Icon set (Lucide-style inline SVG, currentColor so hover states inherit) ----------
const ICON = {
  upload: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
  download: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  trash: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  copy: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  settings: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  check: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  x: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  scissors: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>',
  alert: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  grip: '<svg class="icon icon-grip" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.6"/><circle cx="15" cy="5" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="19" r="1.6"/><circle cx="15" cy="19" r="1.6"/></svg>',
  chevronDown: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:0; margin-left:5px;"><polyline points="6 9 12 15 18 9"/></svg>',
  refresh: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
  promote: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
  merge: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>',
  plus: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  blocks: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  chevronsUpDown: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 15 12 20 17 15"/><polyline points="7 9 12 4 17 9"/></svg>',
  panelLeft: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>',
  pageBreak: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="7" y2="12"/><line x1="10" y1="12" x2="14" y2="12" stroke-dasharray="2.5 2.5"/><line x1="17" y1="12" x2="21" y2="12"/></svg>'
};

// ---------- Data model ----------
// Each question: {id, block, text, type, matrixType, items:[{id,text,recode,role}]}
// role for MC options = 'option'; for Matrix = 'statement' | 'scale' | 'pool'
let survey = [];
let activeId = null;
let uid = 1;
let mode = 7; // 7 or 15
const newId = () => 'i' + (uid++);

// multi-select state (scoped to the active question)
let selectedItems = new Set();
let selectAnchor = null;
let pasteDrafts = {}; // qid -> in-progress paste/carve text
let broadcastOpen = false;
let mixOpen = false;
let broadcastTargets = new Set();
let mixSources = new Set();
let selectedQuestions = new Set();
let questionSelectAnchor = null;
let paintingQ = false;
let paintModeQ = null;
let dragQuestionPayload = null;
let idFieldError = null;
let collapsedBlocks = new Set();
let extraBlocks = []; // empty declared blocks (created via "+ New block") waiting for their first question
let toolsMenuOpen = false;

function blankAdv(){ return { displayLogic:'', skipLogic:'', required:'', randomize:'', defaultValue:'' }; }
function blankItemAdv(){ return { answerDisplayLogic:'', skipLogic:'', exclusive:false, otherText:false, anchor:false }; }
// TE:Form items always carry a blank recode — when copying an item elsewhere (merge, broadcast,
// mix & match) into a context where recode actually matters, fall back to a sequential number
// instead of showing an empty chip.
function safeRecode(val, fallbackIdx){
  return (val === '' || val === null || val === undefined) ? fallbackIdx : val;
}

function loadSample(){
  survey = [
    {
      id:'INTRO1', block:'Block 1', text:'Thank you for taking part in this survey. It should take about five minutes to complete.', type:'DB', matrixType:null,
      adv:blankAdv(), items:[]
    },
    {
      id:'Q1', block:'Block 1', text:'Are you a current customer of Company Name?', type:'MC:SingleAnswer', matrixType:null,
      adv:{ displayLogic:'', skipLogic:'If "No" or "Former customer" → Skip to Q10', required:'Yes', randomize:'', defaultValue:'' },
      items:[
        {id:newId(), text:'Yes', recode:1, role:'option', adv:blankItemAdv()},
        {id:newId(), text:'No', recode:2, role:'option', adv:blankItemAdv()},
        {id:newId(), text:'Former customer', recode:3, role:'option', adv:blankItemAdv()},
      ]
    },
    {
      id:'AUTO_1', block:'Block 1', text:'', type:'Page Break', matrixType:null,
      adv:blankAdv(), items:[]
    },
    {
      id:'Q2', block:'Block 2', text:'Do you agree or disagree with the following statements?', type:'Matrix', matrixType:'Statement',
      adv:{ displayLogic:'Show only if Q1 = "Yes"', skipLogic:'', required:'Yes', randomize:'Yes', defaultValue:'' },
      items:[
        {id:newId(), text:'Leadership is highly engaged with CX', recode:1, role:'statement', adv:blankItemAdv()},

      ]
    },
    {
      id:'Q3', block:'Block 2', text:'Which channels do you use regularly?', type:'MC:MultipleAnswer', matrixType:null,
      adv:{ displayLogic:'', skipLogic:'', required:'', randomize:'Yes', defaultValue:'' },
      items:[
        {id:newId(), text:'Email', recode:1, role:'option', adv:blankItemAdv()},
        {id:newId(), text:'SMS', recode:2, role:'option', adv:blankItemAdv()},
        {id:newId(), text:'Phone', recode:3, role:'option', adv:blankItemAdv()},

      ]
    },
    {
      id:'Q4', block:'Block 2', text:'Product Information Form', type:'TE:Form', matrixType:null,
      adv:blankAdv(),
      items:[
        {id:newId(), text:'Product Version', recode:'', role:'option', adv:blankItemAdv()},
        {id:newId(), text:'Frequency of Use', recode:'', role:'option', adv:blankItemAdv()},
      ]

    {
      id:'CLOSE1', block:'Block 2', text:'Thank you for your time and feedback.', type:'DB', matrixType:null,
      adv:blankAdv(), items:[]
    }

  activeId = survey[1].id;
  selectedQuestions.clear();
  renderAll();
}

function setMode(m){
  mode = m;
  document.body.classList.toggle('mode-15', mode===15);
  document.getElementById('modeBtn7').classList.toggle('on', mode===7);
  document.getElementById('modeBtn15').classList.toggle('on', mode===15);
  renderAll();
}

// ---------- Rendering ----------
function renderAll(){
  renderSidebar();
  renderMain();
}

function typeBadge(type){
  if(type === 'Matrix') return '<span class="badge matrix">Matrix</span>';
  if(type.startsWith('MC')) return '<span class="badge mc">'+type+'</span>';
  return '<span class="badge te">'+type+'</span>';
}

function renderSidebar(){
  const el = document.getElementById('sidebar');

  if(sidebarCollapsed){
    el.innerHTML = `
      <div class="sidebar-mini">
        <button class="mini-expand-btn" onclick="toggleSidebarPanel()" title="Expand questions panel">${ICON.panelLeft}</button>
        <button class="mini-add-btn" onclick="addQuestion()" title="New question">${ICON.plus}</button>
        <div class="mini-list" id="sidebarScroll">
          ${survey.map(q => `
            <div class="mini-qcard ${q.id===activeId?'active':''}" title="${escapeHtml(q.text || q.id)}" onclick="selectQ('${q.id}')">${escapeHtml(q.id)}</div>
          `).join('')}
        </div>
      </div>`;
    return;
  }

  const groups = groupByBlock(survey);
  extraBlocks = extraBlocks.filter(b => !groups.some(g => g.block === b)); // promoted to real once it has a question
  el.innerHTML = `
    <div class="sidebar-fixed">
      <div class="sidebar-title-row">
        <h2 style="margin:0;">Questions</h2>
        <button class="mini-collapse-btn" onclick="toggleSidebarPanel()" title="Collapse to a compact ID list">${ICON.panelLeft}</button>
      </div>
      <button class="add-q-btn primary-add" onclick="addQuestion()">${ICON.plus}New question</button>
      <div class="downloadMenu" id="toolsMenu" style="display:block; margin-top:6px;">
        <button class="add-q-btn small-shortcut" onclick="event.stopPropagation(); toggleToolsMenu()" style="display:flex; align-items:center; justify-content:center;">${ICON.blocks}Tools${ICON.chevronDown}</button>
        <div class="downloadMenu-list ${toolsMenuOpen ? 'open' : ''}" style="min-width:100%;">
          <div class="downloadMenu-item" onclick="createNewBlock(); toggleToolsMenu(false)" title="Add an empty block section you can drag questions into">
            <span>${ICON.plus}New block</span>
          </div>
          <div class="downloadMenu-item" onclick="assignOneBlockPerQuestion(); toggleToolsMenu(false)" title="Give every question its own block and remove page breaks">
            <span>${ICON.blocks}One block per question</span>
          </div>
          <div class="downloadMenu-item" onclick="addPageBreakAfterEveryQuestion(); toggleToolsMenu(false)" title="Removes any existing page breaks, then inserts one after every question">
            <span>${ICON.pageBreak}Page break after every question</span>
          </div>
          <div class="downloadMenu-item" onclick="removeAllPageBreaks(); toggleToolsMenu(false)" title="Removes every page break from the survey">
            <span>${ICON.x}Remove all page breaks</span>
          </div>
          <div class="downloadMenu-item" onclick="renumberQuestionIds(); toggleToolsMenu(false)" title="Renumber Q1, Q2, Q3… in survey order, including intro/close text">
            <span>${ICON.refresh}Renumber question IDs</span>
          </div>
          <div class="downloadMenu-item" onclick="toggleAllBlocks(); toggleToolsMenu(false)" title="Expand or collapse every block section at once">
            <span>${ICON.chevronsUpDown}${allBlocksCollapsed() ? 'Expand all blocks' : 'Collapse all blocks'}</span>
          </div>
        </div>
      </div>
      ${selectedQuestions.size ? `
      <div class="q-bulk-toolbar">
        <strong>${selectedQuestions.size} selected</strong>
        <span class="spacer"></span>
        ${selectedQuestions.size >= 2 ? `<span class="headbtn" onclick="mergeSelectedQuestions()" title="Merge into one Matrix question">${ICON.merge}Merge</span>` : ''}
        <span class="headbtn" onclick="deleteSelectedQuestions()" title="Delete selected questions">${ICON.trash}</span>
        <span class="headbtn" onclick="clearQuestionSelection()">Clear</span>
      </div>` : ''}
    </div>
    <div class="sidebar-scroll" id="sidebarScroll">
      ${groups.map(g => {
        const collapsed = collapsedBlocks.has(g.block);
        const safeBlock = g.block.replace(/'/g, "\\'");
        return `
        <div class="block-group">
          <div class="block-header" draggable="true"
               ondragstart="blockDragStart(event,'${safeBlock}')" ondragend="blockDragEnd()"
               ondragover="blockDragOver(event,'${safeBlock}')" ondragleave="blockDragLeave(event)" ondrop="blockDrop(event,'${safeBlock}')"
               onclick="toggleBlockCollapse('${safeBlock}')">
            <span class="block-grip">${ICON.grip}</span>
            <span class="block-chevron ${collapsed?'collapsed':''}">${ICON.chevronDown}</span>
            <span class="block-name">${escapeHtml(g.block)}</span>
            <span class="block-count">${g.questions.length}</span>
          </div>
          <div class="block-questions ${collapsed?'collapsed':''}">
            ${g.questions.map(q => qcardHtml(q)).join('')}
          </div>
        </div>`;
      }).join('')}
      ${extraBlocks.map(b => {
        const safeBlock = b.replace(/'/g, "\\'");
        return `
        <div class="block-group">
          <div class="block-header empty-block-header">
            <span class="block-grip" style="visibility:hidden;">${ICON.grip}</span>
            <span class="block-chevron collapsed" style="visibility:hidden;">${ICON.chevronDown}</span>
            <span class="block-name" contenteditable="true" onblur="renameExtraBlock('${safeBlock}', this.innerText)">${escapeHtml(b)}</span>
            <span class="block-count">0</span>
          </div>
          <div class="block-questions block-questions-empty"
               ondragover="emptyBlockDragOver(event)" ondragleave="emptyBlockDragLeave(event)" ondrop="emptyBlockDrop(event,'${safeBlock}')">
            <div class="lane-empty">Drag questions here</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function createNewBlock(){
  const n = groupByBlock(survey).length + extraBlocks.length + 1;
  extraBlocks.push('New Block ' + n);
  renderSidebar();
}

function renameExtraBlock(oldName, newVal){
  const trimmed = newVal.trim();
  if(!trimmed){ renderSidebar(); return; }
  const idx = extraBlocks.indexOf(oldName);
  if(idx >= 0) extraBlocks[idx] = trimmed;
  renderSidebar();
}

function emptyBlockDragOver(ev){
  ev.preventDefault();
  ev.stopPropagation();
  if(!dragQuestionPayload) return;
  ev.currentTarget.classList.add('dragover');
}
function emptyBlockDragLeave(ev){ ev.currentTarget.classList.remove('dragover'); }
function emptyBlockDrop(ev, blockName){
  ev.preventDefault();
  ev.stopPropagation();
  ev.currentTarget.classList.remove('dragover');
  if(!dragQuestionPayload) return;
  const draggedIds = dragQuestionPayload.ids;
  const draggedQs = survey.filter(q => draggedIds.includes(q.id));
  draggedQs.forEach(q => { q.block = blockName; });
  survey = [...survey.filter(q => !draggedIds.includes(q.id)), ...draggedQs];
  dragQuestionPayload = null;
  renderAll();
}

// ---------- Block-level drag: reposition an entire block section (and every question in it) as one unit ----------
let draggedBlockName = null;
function blockDragStart(ev, blockName){
  ev.stopPropagation();
  draggedBlockName = blockName;
  ev.dataTransfer.effectAllowed = 'move';
}
function blockDragEnd(){
  draggedBlockName = null;
  document.querySelectorAll('.block-header.dragover-block').forEach(el=>el.classList.remove('dragover-block'));
}
function blockDragOver(ev, blockName){
  ev.preventDefault();
  ev.stopPropagation();
  if(!draggedBlockName || draggedBlockName === blockName) return;
  ev.currentTarget.classList.add('dragover-block');
}
function blockDragLeave(ev){ ev.currentTarget.classList.remove('dragover-block'); }
function blockDrop(ev, targetBlockName){
  ev.preventDefault();
  ev.stopPropagation();
  document.querySelectorAll('.block-header.dragover-block').forEach(el=>el.classList.remove('dragover-block'));
  if(!draggedBlockName || draggedBlockName === targetBlockName){ draggedBlockName = null; return; }

  const groups = groupByBlock(survey);
  const draggedGroup = groups.find(g => g.block === draggedBlockName);
  const targetGroup = groups.find(g => g.block === targetBlockName);
  if(!draggedGroup || !targetGroup){ draggedBlockName = null; return; }

  const draggedIds = new Set(draggedGroup.questions.map(q=>q.id));
  const draggedQs = draggedGroup.questions;
  const remaining = survey.filter(q => !draggedIds.has(q.id));

  const rect = ev.currentTarget.getBoundingClientRect();
  const insertAfter = (ev.clientY - rect.top) > rect.height / 2;
  const targetFirstId = targetGroup.questions[0].id;
  const targetLastId = targetGroup.questions[targetGroup.questions.length-1].id;
  const insertIdx = insertAfter
    ? remaining.findIndex(q=>q.id===targetLastId) + 1
    : remaining.findIndex(q=>q.id===targetFirstId);

  remaining.splice(insertIdx, 0, ...draggedQs);
  survey = remaining;

  draggedBlockName = null;
  renderAll();
}


function groupByBlock(list){
  const groups = [];
  let current = null;
  list.forEach(q => {
    const label = q.block && q.block.trim() ? q.block : '(no block)';
    if(!current || current.block !== label){
      current = { block: label, questions: [] };
      groups.push(current);
    }
    current.questions.push(q);
  });
  return groups;
}

function toggleBlockCollapse(block){
  collapsedBlocks.has(block) ? collapsedBlocks.delete(block) : collapsedBlocks.add(block);
  renderSidebar();
}

function allBlocksCollapsed(){
  const groups = groupByBlock(survey);
  return groups.length > 0 && groups.every(g => collapsedBlocks.has(g.block));
}

function toggleAllBlocks(){
  if(allBlocksCollapsed()){
    collapsedBlocks.clear(); // expand everything
  } else {
    groupByBlock(survey).forEach(g => collapsedBlocks.add(g.block)); // collapse everything
  }
  renderSidebar();
}

  survey = survey.filter(q => q.type !== 'Page Break'); // block boundaries make page breaks redundant

function addPageBreakAfterEveryQuestion(){
  const cleaned = survey.filter(q => q.type !== 'Page Break'); // clear any existing ones first
  const result = [];
  let n = 1;
  cleaned.forEach((q, idx) => {
    result.push(q);
    if(idx < cleaned.length - 1){ // no trailing page break after the very last question
      result.push({ id:'AUTO_'+n, block:q.block, text:'', type:'Page Break', matrixType:null, adv:blankAdv(), items:[] });
      n++;
    }
  });
  survey = result;
  if(!survey.find(x=>x.id===activeId)) activeId = survey.length ? survey[0].id : null;

  renderAll();

function renumberQuestionIds(){
  let n = 1;
  survey.forEach(q => {
    if(q.type === 'Page Break') return; // page breaks keep their own AUTO_ naming, nothing to number
    const newIdVal = 'Q' + n;
    if(q.id !== newIdVal){

      q.id = newIdVal;

function addStructuralRow(type){

    id = 'AUTO_'+n; block = lastBlock; text = '';

function duplicateQ(id){
  const src = survey.find(q=>q.id===id);
  const copy = JSON.parse(JSON.stringify(src));
  const base = src.id.replace(/_\d+$/, ''); // strip a trailing _N so duplicating a duplicate keeps counting off the original base
  let n = 1;
  while(survey.some(q => q.id === base + '_' + n)) n++;
  copy.id = base + '_' + n;
  copy.items.forEach(it => it.id = newId());
  survey.splice(survey.indexOf(src)+1, 0, copy);
  activeId = copy.id;
  selectedItems.clear();
  renderAll();
}

let suggestionCache = {}; // qid -> [{text, recode, status:'pending'|'added'|'dismissed'}]
let carveDebounce = null;
let manualCarveOpen = false;
let selectedSuggIds = new Set();

function toggleManualCarve(){ manualCarveOpen = !manualCarveOpen; renderAll(); }

function updateSuggestions(qid){
  const text = pasteDrafts[qid] || '';

    ? smartSegment(text).map(s => ({...s, status:'pending'}))
    : [];
  selectedSuggIds.clear();
  renderSuggestionChips(qid);
}

  currentSuggQid = qid;

  if(!items.length){ wrap.innerHTML = ''; return; }
  const selCount = items.filter(i=>selectedSuggIds.has(i._sid)).length;
  wrap.innerHTML = `
    <div class="suggest-hint">Found ${items.length} possible item${items.length===1?'':'s'} — check the ones you want, or tap the ${ICON.x} to skip one.</div>

        <span class="chip ${selectedSuggIds.has(it._sid)?'selected':''}">

        </span>`).join('')}
    </div>
    ${selCount ? `
    <div class="bulk-toolbar" style="position:static;">
      <strong>${selCount} selected</strong>
      <span class="spacer"></span>
      <button class="small primary" onclick="addSelectedSuggestions('${qid}')">${ICON.check}Add selected</button>
      <button class="small ghost" onclick="selectedSuggIds.clear(); renderSuggestionChips('${qid}')">Clear</button>
    </div>` : ''}`;
}

function smartSegment(raw){
  const text = raw.trim();
  if(!text) return [];
  let segments;
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length >= 2){
    segments = lines;
  } else if((text.match(/;/g)||[]).length >= 2){
    segments = text.split(';');
  } else if((text.match(/\|/g)||[]).length >= 2){
    segments = text.split('|');
  } else if((text.match(/\d+[\.\)]\s/g)||[]).length >= 2){
    segments = text.split(/(?=\d+[\.\)]\s)/);
  } else if((text.match(/(?:^|\s)[A-Za-z][\.\)]\s/g)||[]).length >= 2){
    segments = text.split(/(?=(?:^|\s)[A-Za-z][\.\)]\s)/);
  } else {
    segments = [text];
  }
  return segments.map(s=>s.trim()).filter(Boolean).map((seg,i) => {
    const parsed = parseCandidate(seg, i);
    parsed._sid = 's'+i+'_'+Math.random().toString(36).slice(2,7);
    return parsed;
  });
}

function parseCandidate(seg, idx){
  let m;
  // "1(text)" -> recode from number, text from parens
  m = seg.match(/^(\d+)\s*\(([^)]+)\)\s*$/);
  if(m) return { text: m[2].trim(), recode: parseInt(m[1]) };
  // "text (5)" or "text (0-10)" -> keep full text, recode from first number in parens
  m = seg.match(/^(.*)\((\d+)(?:-\d+)?\)\s*$/);
  if(m) return { text: seg.trim(), recode: parseInt(m[2]) };
  // "1. Text" / "1) Text" / "1 - Text" / "1: Text"
  m = seg.match(/^(\d+)\s*[\.\)\-:]\s*(.+)$/);
  if(m) return { text: m[2].trim(), recode: parseInt(m[1]) };
  // "A. Text" / "a) Text" -> strip letter marker, sequential recode
  m = seg.match(/^[A-Za-z]\s*[\.\)]\s*(.+)$/);
  if(m) return { text: m[1].trim(), recode: idx+1 };
  // "text, 5" or "text | 5"
  m = seg.match(/^(.+?)[,|]\s*(\d+)\s*$/);
  if(m) return { text: m[1].trim(), recode: parseInt(m[2]) };
  // default: strip bullet characters, sequential recode
  return { text: seg.replace(/^[-•\*]\s*/, '').trim(), recode: idx+1 };
}

function addSelectedSuggestions(qid){
  const q = survey.find(x=>x.id===qid);
  const target = document.getElementById('carveTarget').value;
  const list = (suggestionCache[qid] || []).filter(i=>i.status==='pending' && selectedSuggIds.has(i._sid));
  if(!list.length) return;
  let startRecode = q.items.filter(i=>i.role===target).length + 1;
  list.forEach(s => {
    q.items.push({id:newId(), text:s.text, recode: typeof s.recode==='number' ? s.recode : startRecode++, role:target, adv:blankItemAdv()});
    s.status = 'added';
    selectedSuggIds.delete(s._sid);
  });
  renderAll();
}

function dismissSuggestion(qid, sid){
  const list = suggestionCache[qid] || [];
  const s = list.find(i=>i._sid===sid);
  if(s) s.status = 'dismissed';
  selectedSuggIds.delete(sid);
  renderAll();
}

function acceptAllSuggestions(qid){
  const q = survey.find(x=>x.id===qid);
  const target = document.getElementById('carveTarget').value;
  const list = (suggestionCache[qid] || []).filter(i=>i.status==='pending');
  if(!list.length) return;
  let startRecode = q.items.filter(i=>i.role===target).length + 1;
  list.forEach(s => {
    q.items.push({id:newId(), text:s.text, recode: typeof s.recode==='number' ? s.recode : startRecode++, role:target, adv:blankItemAdv()});
    s.status = 'added';
    selectedSuggIds.delete(s._sid);
  });
  renderAll();
}

function carveSelection(qid){
  const pb = document.getElementById('pasteBox');
  const target = document.getElementById('carveTarget').value;
  if(!pb) return;
  const start = pb.selectionStart, end = pb.selectionEnd;
  if(start === end) return; // nothing highlighted — no-op
  const text = pb.value.slice(start, end).trim();
  if(!text) return;
  const remaining = pb.value.slice(0, start) + pb.value.slice(end);
  const q = survey.find(x=>x.id===qid);
  const roleItems = q.items.filter(i=>i.role===target);
  q.items.push({id:newId(), text, recode:roleItems.length+1, role:target, adv:blankItemAdv()});
  pasteDrafts[qid] = remaining;
  suggestionCache[qid] = undefined; // remaining text changed — re-derive suggestions next render
  renderAll();
}

// ---------- Multi-select, marquee, bulk move ----------
function toggleSelect(ev, qid, itemId){
  ev.stopPropagation();
  const q = survey.find(x=>x.id===qid);
  if(ev.shiftKey && selectAnchor){
    const it = q.items.find(i=>i.id===itemId);
    const anchorIt = q.items.find(i=>i.id===selectAnchor);
    if(it && anchorIt && it.role === anchorIt.role){
      const group = q.items.filter(i=>i.role===it.role);
      const a = group.findIndex(i=>i.id===selectAnchor), b = group.findIndex(i=>i.id===itemId);
      const [lo,hi] = a<b ? [a,b] : [b,a];
      group.slice(lo,hi+1).forEach(i=>selectedItems.add(i.id));
    }
  } else {
    // click on the checkbox always toggles that single item, leaving the rest of the selection intact
    selectedItems.has(itemId) ? selectedItems.delete(itemId) : selectedItems.add(itemId);
    selectAnchor = itemId;
  }
  renderAll();
}

function clearSelection(){ selectedItems.clear(); selectAnchor = null; renderAll(); }

// ---------- Paint-select: press a checkbox and drag across others to select a run in one gesture ----------
let painting = false;
let paintMode = null; // 'select' | 'deselect'

function startPaintSelect(ev, qid, itemId){
  if(ev.shiftKey){
    toggleSelect(ev, qid, itemId); // keep shift-click range-select behaving exactly as before
    return;
  }
  ev.preventDefault();
  ev.stopPropagation();
  painting = true;
  paintMode = selectedItems.has(itemId) ? 'deselect' : 'select';
  selectAnchor = itemId;
  paintApply(itemId, ev.currentTarget);
}

function paintOverItem(ev, qid, itemId){
  if(!painting) return;
  paintApply(itemId, ev.currentTarget);
}

function paintApply(itemId, selboxEl){
  if(paintMode === 'select') selectedItems.add(itemId);
  else selectedItems.delete(itemId);
  const itemEl = selboxEl && selboxEl.closest ? selboxEl.closest('.item') : null;
  if(itemEl) itemEl.classList.toggle('selected', paintMode === 'select');
}

document.addEventListener('mouseup', () => {
  if(painting){
    painting = false;
    paintMode = null;
    renderAll(); // one full refresh at the end of the gesture to update the bulk toolbar / counts
  }
  if(paintingQ){
    paintingQ = false;
    paintModeQ = null;
    renderSidebar();
  }
});

// ---------- Question select + drag-reorder (left panel) ----------
function toggleQuestionSelect(ev, qid){
  ev.stopPropagation();
  if(ev.shiftKey && questionSelectAnchor){
    const a = survey.findIndex(q=>q.id===questionSelectAnchor);
    const b = survey.findIndex(q=>q.id===qid);
    if(a>=0 && b>=0){
      const [lo,hi] = a<b ? [a,b] : [b,a];
      survey.slice(lo,hi+1).forEach(q=>selectedQuestions.add(q.id));
    }
  } else {
    selectedQuestions.has(qid) ? selectedQuestions.delete(qid) : selectedQuestions.add(qid);
    questionSelectAnchor = qid;
  }
  renderSidebar();
}

function startPaintSelectQ(ev, qid){
  ev.stopPropagation();
  if(ev.shiftKey){ toggleQuestionSelect(ev, qid); return; }
  ev.preventDefault();
  paintingQ = true;
  paintModeQ = selectedQuestions.has(qid) ? 'deselect' : 'select';
  questionSelectAnchor = qid;
  paintApplyQ(qid, ev.currentTarget);
}

function paintOverQuestion(ev, qid){
  if(!paintingQ) return;
  paintApplyQ(qid, ev.currentTarget);
}

function paintApplyQ(qid, selboxEl){
  if(paintModeQ === 'select') selectedQuestions.add(qid);
  else selectedQuestions.delete(qid);
  const cardEl = selboxEl && selboxEl.closest ? selboxEl.closest('.qcard') : null;
  if(cardEl) cardEl.classList.toggle('qselected', paintModeQ === 'select');

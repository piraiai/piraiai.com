function clearQuestionSelection(){ selectedQuestions.clear(); questionSelectAnchor = null; renderSidebar(); }

function deleteSelectedQuestions(){
  if(!selectedQuestions.size) return;
  survey = survey.filter(q => !selectedQuestions.has(q.id));
  if(!survey.find(q=>q.id===activeId)) activeId = survey.length ? survey[0].id : null;
  selectedQuestions.clear();
  renderAll();
}

// Merge 2+ selected questions into a single Matrix: each merged-away question's TEXT becomes
// a new Statement row; scale points are reused from an existing Matrix base, or borrowed from
// the first contributing question's own options if the base isn't a Matrix yet.
function mergeSelectedQuestions(){
  const ids = Array.from(selectedQuestions);
  if(ids.length < 2) return;

  // Page Break has no content and nothing meaningful to merge — leave it out of the
  // operation entirely (it stays in the survey untouched, it just doesn't participate).
  const selectedQs = survey.filter(q => ids.includes(q.id) && q.type !== 'Page Break');
  if(selectedQs.length < 2) return;
  const mergedIds = selectedQs.map(q => q.id); // only these actually get removed after merging

  const allDB = selectedQs.every(q => q.type === 'DB');
  if(allDB){
    // DB is a real question type, just one with no items — merging several DB questions
    // means appending their text together, not building statements or options out of nothing.
    const base = selectedQs[0];
    selectedQs.slice(1).forEach(src => {
      if(src.text && src.text.trim()){
        base.text = base.text.trim() ? (base.text.trim() + ' ' + src.text.trim()) : src.text.trim();
      }
    });
    survey = survey.filter(q => q.id === base.id || !mergedIds.includes(q.id));
    activeId = base.id;
    selectedQuestions.clear();
    renderAll();
    return;
  }

  const existingMatrix = selectedQs.find(q => q.type === 'Matrix');

  if(existingMatrix){
    // A Matrix is already among the selection — treat this as "repair a split matrix":
    // each other question's text becomes a new Statement, its options become the scale
    // (only if the Matrix doesn't have one yet) or fall back to Pool so nothing is lost.
    const base = existingMatrix;
    const others = selectedQs.filter(q => q.id !== base.id);

    others.forEach(src => {
      const stmtCount = base.items.filter(i=>i.role==='statement').length;
      base.items.push({ id:newId(), text: src.text, recode: stmtCount+1, role:'statement', adv: blankItemAdv() });

      const hasScale = base.items.some(i=>i.role==='scale');
      if(!hasScale && src.type !== 'Matrix'){
        src.items.forEach((o,idx) => {
          base.items.push({ id:newId(), text:o.text, recode:idx+1, role:'scale', adv:{...o.adv} });
        });
      } else {
        src.items.forEach((o,idx) => {
          const poolCount = base.items.filter(i=>i.role==='pool').length;
          base.items.push({ id:newId(), text:o.text, recode:safeRecode(o.recode, poolCount+1), role:'pool', adv:{...o.adv} });
        });
      }
    });

    survey = survey.filter(q => q.id === base.id || !mergedIds.includes(q.id));
    activeId = base.id;

  } else {
    // No Matrix involved — don't guess a structure. Keep the base question's own type and
    // land everything (every contributor's text and every one of its items) in Pool, so
    // nothing is treated as export-ready until you deliberately move it into Options.
    const base = selectedQs[0];
    const others = selectedQs.filter(q => q.id !== base.id);

    others.forEach(src => {
      if(src.text && src.text.trim()){
        const poolCount = base.items.filter(i=>i.role==='pool').length;
        base.items.push({ id:newId(), text: src.text, recode: poolCount+1, role:'pool', adv: blankItemAdv() });
      }
      src.items.forEach(o => {
        const poolCount = base.items.filter(i=>i.role==='pool').length;
        base.items.push({ id:newId(), text:o.text, recode:safeRecode(o.recode, poolCount+1), role:'pool', adv:{...o.adv} });
      });
    });

    survey = survey.filter(q => q.id === base.id || !mergedIds.includes(q.id));
    activeId = base.id;
  }
  selectedQuestions.clear();
  renderAll();
}

// dragging a question: if it's part of the current multi-selection, drag the whole batch together
function qDragStart(ev, qid){
  const ids = (selectedQuestions.has(qid) && selectedQuestions.size > 1) ? Array.from(selectedQuestions) : [qid];
  dragQuestionPayload = { ids };
  ev.dataTransfer.effectAllowed = 'move';
}
function qDragEnd(){
  dragQuestionPayload = null;
  document.querySelectorAll('.qcard.dragover-q').forEach(el=>el.classList.remove('dragover-q'));
}
function qDragOver(ev, qid){
  ev.preventDefault();
  ev.stopPropagation();
  if(!dragQuestionPayload || dragQuestionPayload.ids.includes(qid)) return;
  ev.currentTarget.classList.add('dragover-q');
}
function qDragLeave(ev){
  ev.currentTarget.classList.remove('dragover-q');
}
function qDrop(ev, targetQid){
  ev.preventDefault();
  ev.stopPropagation();
  document.querySelectorAll('.qcard.dragover-q').forEach(el=>el.classList.remove('dragover-q'));
  if(!dragQuestionPayload) return;
  const draggedIds = dragQuestionPayload.ids;
  if(draggedIds.includes(targetQid)){ dragQuestionPayload = null; return; }

  const targetQ = survey.find(q => q.id === targetQid);
  const targetBlock = targetQ ? targetQ.block : null;

  const rect = ev.currentTarget.getBoundingClientRect();
  const insertAfter = (ev.clientY - rect.top) > rect.height / 2;

  const draggedQs = survey.filter(q => draggedIds.includes(q.id));
  // standard drag-into-a-different-block behavior: the moved question(s) join the target's block
  if(targetBlock){
    draggedQs.forEach(q => { q.block = targetBlock; });
  }
  const remaining = survey.filter(q => !draggedIds.includes(q.id));
  let targetIdx = remaining.findIndex(q => q.id === targetQid);
  if(insertAfter) targetIdx += 1;
  remaining.splice(targetIdx, 0, ...draggedQs);
  survey = remaining;

  dragQuestionPayload = null;
  renderAll();
}

function renderBulkToolbar(q){
  const inMatrix = q.type === 'Matrix';
  return `
    <div class="bulk-toolbar">
      <strong>${selectedItems.size} selected</strong>
      <span class="spacer"></span>
      ${inMatrix ? `
        <button class="small" onclick="bulkMove('${q.id}','pool')">→ Pool</button>
        <button class="small" onclick="bulkMove('${q.id}','statement')">→ Statements</button>
        <button class="small" onclick="bulkMove('${q.id}','scale')">→ Scale</button>
      ` : `
        <button class="small" onclick="bulkMove('${q.id}','pool')">→ Pool</button>
        <button class="small" onclick="bulkMove('${q.id}','option')">→ Options</button>
      `}
      <button class="small danger" onclick="bulkRemove('${q.id}')">${ICON.x}Remove selected</button>
      <button class="small ghost" onclick="clearSelection()">Clear</button>
    </div>`;
}

function bulkMove(qid, targetRole){
  const q = survey.find(x=>x.id===qid);
  q.items.forEach(it => { if(selectedItems.has(it.id)) it.role = targetRole; });
  clearSelection();
}

function bulkRemove(qid){
  const q = survey.find(x=>x.id===qid);
  q.items = q.items.filter(i=>!selectedItems.has(i.id));
  clearSelection();
}

function moveAllRole(qid, fromRole, toRole){
  const q = survey.find(x=>x.id===qid);
  q.items.forEach(it => { if(it.role===fromRole) it.role = toRole; });
  renderAll();
}

function resetRecode(qid, role){
  const q = survey.find(x=>x.id===qid);
  q.items.filter(i=>i.role===role).forEach((i,idx)=>{ i.recode = idx+1; });
  renderAll();
}

function attachMarquee(){
  const wrap = document.getElementById('lanesWrap');
  if(!wrap) return;
  wrap.style.position = 'relative';
  wrap.addEventListener('mousedown', marqueeStart);
}

let marqueeState = null;
function marqueeStart(ev){
  if(ev.target.closest('.item') || ev.target.closest('button') || ev.target.closest('input') || ev.target.closest('.headbtn')) return;
  const wrap = ev.currentTarget;
  const wrapRect = wrap.getBoundingClientRect();
  const box = document.createElement('div');
  box.className = 'marquee-box';
  wrap.appendChild(box);
  marqueeState = { wrap, wrapRect, startX: ev.clientX - wrapRect.left, startY: ev.clientY - wrapRect.top, box, additive: ev.shiftKey || ev.ctrlKey || ev.metaKey };
  document.addEventListener('mousemove', marqueeMove);
  document.addEventListener('mouseup', marqueeEnd);
  ev.preventDefault();
}
function marqueeMove(ev){
  if(!marqueeState) return;
  const { wrapRect, startX, startY, box } = marqueeState;
  const curX = ev.clientX - wrapRect.left, curY = ev.clientY - wrapRect.top;
  const x = Math.min(startX, curX), y = Math.min(startY, curY);
  const w = Math.abs(curX - startX), h = Math.abs(curY - startY);
  box.style.left = x+'px'; box.style.top = y+'px'; box.style.width = w+'px'; box.style.height = h+'px';
}
function marqueeEnd(ev){
  if(!marqueeState) return;
  const { wrap, box, additive } = marqueeState;
  const boxRect = box.getBoundingClientRect();
  if(!additive) selectedItems.clear();
  wrap.querySelectorAll('.item').forEach(el => {
    const r = el.getBoundingClientRect();
    const intersects = !(r.right < boxRect.left || r.left > boxRect.right || r.bottom < boxRect.top || r.top > boxRect.bottom);
    if(intersects) selectedItems.add(el.getAttribute('data-item-id'));
  });
  box.remove();
  document.removeEventListener('mousemove', marqueeMove);
  document.removeEventListener('mouseup', marqueeEnd);
  marqueeState = null;
  renderAll();
}

// ---------- Broadcast (send selected items to multiple other questions) ----------
function toggleBroadcast(){ broadcastOpen = !broadcastOpen; renderAll(); }
function toggleBroadcastTarget(id, checked){ checked ? broadcastTargets.add(id) : broadcastTargets.delete(id); }

function broadcastSend(qid){
  const q = survey.find(x=>x.id===qid);
  const targets = Array.from(broadcastTargets);
  const selItems = selectedItems.size ? q.items.filter(i=>selectedItems.has(i.id)) : q.items;
  if(!targets.length || !selItems.length) return;
  targets.forEach(tid => {
    const t = survey.find(x=>x.id===tid);
    if(!t) return;
    const targetRole = 'pool'; // every question type now has a Pool staging lane
    const startRecode = t.items.filter(i=>i.role===targetRole).length + 1;
    selItems.forEach((it, idx) => {
      t.items.push({id:newId(), text:it.text, recode:startRecode+idx, role:targetRole, adv:blankItemAdv()});
    });
  });
  broadcastOpen = false;
  broadcastTargets.clear();
  clearSelection();
}

function updateAdv(qid, field, val){
  const q = survey.find(x=>x.id===qid);
  q.adv[field] = val;
  renderSurveyPreview();
}

function toggleItemAdv(itemId){
  const el = document.getElementById('adv-'+itemId);
  if(el) el.classList.toggle('open');
}

function updateItemAdv(qid, itemId, field, val){
  const q = survey.find(x=>x.id===qid);
  const it = q.items.find(i=>i.id===itemId);
  it.adv[field] = val;
  renderSurveyPreview();
}

// ---------- Field / item mutation ----------
function updateField(qid, field, val){
  const q = survey.find(x=>x.id===qid);
  if(field==='id'){
    const trimmed = val.trim();
    const taken = trimmed !== qid && survey.some(x => x.id === trimmed);
    if(!trimmed || taken){
      idFieldError = !trimmed
        ? "Question ID can't be empty."
        : `"${trimmed}" is already used by another question — IDs must be unique or lookups, editing, and export will break.`;
      renderAll(); // q.id is untouched, so the field reverts to its previous value on re-render
      return;
    }
    idFieldError = null;
    activeId = trimmed;
    q.id = trimmed;
    renderAll();
    return;
  }
  if(field==='block'){
    const trimmed = val.trim();
    if(!trimmed){ renderAll(); return; } // ignore empty — revert to whatever it was
    // Block names a whole section, not one row — renaming it from any question inside a
    // contiguous run of the same block renames the entire run, keeping the tree consistent.
    const oldBlock = q.block;
    const idx = survey.indexOf(q);
    let start = idx, end = idx;
    while(start > 0 && survey[start-1].block === oldBlock) start--;
    while(end < survey.length-1 && survey[end+1].block === oldBlock) end++;
    for(let i=start; i<=end; i++){ survey[i].block = trimmed; }
    renderAll();
    return;
  }
  q[field] = val;
  renderAll();
}

function changeType(qid, newType){
  const q = survey.find(x=>x.id===qid);
  const wasMatrix = q.type === 'Matrix';
  const isMatrix = newType === 'Matrix';
  q.type = newType;
  selectedItems.clear();
  broadcastOpen = false;
  mixOpen = false;
  selectedSuggIds.clear();
  if(isMatrix && !wasMatrix){
    // moving into matrix: everything becomes unassigned pool for the user to sort
    q.items.forEach(it => it.role = 'pool');
    q.matrixType = 'Statement';
  } else if(!isMatrix && wasMatrix){
    // leaving matrix: statements + scale don't map cleanly onto a flat list, so land
    // everything in Pool rather than assuming it's export-ready — same "unsorted first" rule
    q.items.forEach(it => it.role = 'pool');
    q.matrixType = null;
  }
  renderAll();
}

function addItem(qid, role){
  const q = survey.find(x=>x.id===qid);
  const roleItems = q.items.filter(i=>i.role===role);
  q.items.push({id:newId(), text:'New item', recode:roleItems.length+1, role, adv:blankItemAdv()});
  renderAll();
}

function removeItem(qid, itemId){
  const q = survey.find(x=>x.id===qid);
  q.items = q.items.filter(i=>i.id!==itemId);
  renderAll();
}

function duplicateItem(qid, itemId){
  const q = survey.find(x=>x.id===qid);
  const it = q.items.find(i=>i.id===itemId);
  if(!it) return;
  const copy = { ...it, id:newId(), text: it.text, adv: {...it.adv} };
  const pos = q.items.indexOf(it);
  q.items.splice(pos+1, 0, copy);
  // renumber recode sequentially within the same role, if recode is numeric
  const sameRole = q.items.filter(i=>i.role===it.role);
  if(sameRole.length && typeof sameRole[0].recode === 'number'){
    sameRole.forEach((i,idx)=>{ i.recode = idx+1; });
  }
  renderAll();
}

function useAsQuestionText(ev, qid, itemId){
  const q = survey.find(x=>x.id===qid);
  const it = q.items.find(i=>i.id===itemId);
  if(!it) return;
  if(ev && (ev.altKey || ev.metaKey)){
    q.text = it.text; // Alt/Cmd-click: replace outright
  } else {
    q.text = q.text.trim() ? (q.text.trim() + ' ' + it.text) : it.text; // plain click: append
  }
  renderAll();
}

function updateItemText(qid, itemId, text){
  const q = survey.find(x=>x.id===qid);
  const it = q.items.find(i=>i.id===itemId);
  it.text = text.trim();
  renderSurveyPreview();
}

function updateItemRecode(qid, itemId, val){
  const q = survey.find(x=>x.id===qid);
  const it = q.items.find(i=>i.id===itemId);
  it.recode = isNaN(parseInt(val)) ? val.trim() : parseInt(val);
  renderSurveyPreview();
}

// ---------- Drag & drop ----------
let dragPayload = null;
function dragStart(ev, qid, itemId){
  dragPayload = {qid, itemId};
  ev.dataTransfer.effectAllowed = 'move';
}
function dragOver(ev){ ev.preventDefault(); ev.currentTarget.classList.add('dragover'); }
function drop(ev, qid, targetRole){
  ev.preventDefault();
  document.querySelectorAll('.lane').forEach(l=>l.classList.remove('dragover'));
  if(!dragPayload) return;
  const q = survey.find(x=>x.id===qid);
  const it = q.items.find(i=>i.id===dragPayload.itemId);
  if(!it) return;
  it.role = targetRole;
  dragPayload = null;
  renderAll();
}

// item-to-item drag: reorders within a lane, or moves + reclassifies across lanes when dropped directly on an item
function itemDragOver(ev){
  ev.preventDefault();
  ev.stopPropagation();
  ev.currentTarget.classList.add('dragover-item');
}
function itemDragLeave(ev){
  ev.currentTarget.classList.remove('dragover-item');
}
function dropOnItem(ev, qid, targetItemId){
  ev.preventDefault();
  ev.stopPropagation();
  document.querySelectorAll('.item.dragover-item').forEach(el=>el.classList.remove('dragover-item'));
  document.querySelectorAll('.lane').forEach(l=>l.classList.remove('dragover'));
  if(!dragPayload) return;
  const q = survey.find(x=>x.id===qid);
  const dragItem = q.items.find(i=>i.id===dragPayload.itemId);
  const targetItem = q.items.find(i=>i.id===targetItemId);
  if(!dragItem || !targetItem || dragItem.id === targetItem.id){ dragPayload = null; return; }

  const targetRole = targetItem.role;
  q.items = q.items.filter(i=>i.id!==dragItem.id);
  dragItem.role = targetRole;
  const targetIdx = q.items.indexOf(targetItem);
  q.items.splice(targetIdx, 0, dragItem);

  dragPayload = null;
  renderAll();
}
document.addEventListener('dragleave', e=>{
  if(e.target.classList && e.target.classList.contains('lane')) e.target.classList.remove('dragover');
});

// ---------- Break text / mix & match ----------
function breakText(qid){
  const box = document.getElementById('pasteBox');
  const lines = box.value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return;
  const q = survey.find(x=>x.id===qid);
  const targetRole = 'pool'; // every question type now has a Pool staging lane
  const startRecode = q.items.filter(i=>i.role===targetRole).length + 1;
  lines.forEach((line, idx) => {
    q.items.push({id:newId(), text:line, recode:startRecode+idx, role:targetRole, adv:blankItemAdv()});
  });
  box.value = '';
  renderAll();
}

function mixMatchMulti(qid){
  const sources = Array.from(mixSources);
  if(!sources.length) return;
  const q = survey.find(x=>x.id===qid);
  const targetRole = 'pool'; // every question type now has a Pool staging lane
  sources.forEach(srcId => {
    const src = survey.find(x=>x.id===srcId);
    if(!src) return;
    const startRecode = q.items.filter(i=>i.role===targetRole).length + 1;
    src.items.forEach((it, idx) => {
      q.items.push({id:newId(), text:it.text, recode:startRecode+idx, role:targetRole, adv:blankItemAdv()});
    });
  });
  mixOpen = false;
  mixSources.clear();
  renderAll();
}

function toggleMix(){ mixOpen = !mixOpen; renderAll(); }
function toggleMixSource(id, checked){ checked ? mixSources.add(id) : mixSources.delete(id); }

// ---------- Excel preview + export (matches production template exactly) ----------
const HEADERS_7  = ['Block Name','Question ID','Question Text','Question Type','Answer Option Text','Recode Value','Matrix Type'];
const HEADERS_15 = [...HEADERS_7, 'Display Logic','Answer Display Logic','Skip Logic','Required','Randomize','Default Value','Exclusive','OtherText'];
const WIDTHS_7  = [12.83,13.83,50.83,19.83,25.83,14.83,13.83];
const WIDTHS_15 = [25,15,50,20,40,15,15,20,20,20,20,20,20,20,20];

// Builds full row arrays (15-col shape). Slice to 7 when exporting/previewing in 7-col mode.
// Mirrors baseconversion.md + observed production output:
//  - Block Name & Question ID repeat on EVERY row of a question (never blanked)
//  - Question Text & Question Type blank after row 1 — EXCEPT Matrix, which repeats "Matrix" every row
//  - Matrix has two independent recode sequences: statements 1..n, then scale points restart 1..n
//  - TE:Form never carries a Recode Value
//  - Skip Logic / Randomize can be set question-level (row 1) AND independently per option row
function buildRows15(){
  const rows = [];
  const push = (block,qid,text,type,opt,recode,mtype, qAdv, itemAdv) => {
    const a = qAdv || {};
    const ia = itemAdv || {};
    rows.push([
      block, qid, text, type, opt, recode, mtype,
      a.displayLogic || '',
      ia.answerDisplayLogic || '',
      ia.skipLogic || a.skipLogic || '',
      a.required || '',
      ia.anchor ? 'Anchor' : (a.randomize || ''),
      a.defaultValue || '',
      ia.exclusive ? 'Yes' : '',
      ia.otherText ? 'Yes' : ''
    ]);
  };

  survey.forEach(q => {
    if(q.type === 'Page Break'){
      push(q.block, q.id, '', 'Page Break', '', '', '', {}, {});
      return;
    }
    if(q.type === 'DB'){
      push(q.block, q.id, q.text, 'DB', '', '', '', {}, {});
      return;
    }
    if(q.type === 'Matrix'){
      let stmts = q.items.filter(i=>i.role==='statement');
      let scale = q.items.filter(i=>i.role==='scale');
      // guardrail from baseconversion.md: <2 statements or <2 scale points is not a valid Matrix
      if(stmts.length < 2 || scale.length < 2){
        const opts = [...stmts, ...scale];
        let first = true;
        if(!opts.length) push(q.block, q.id, q.text, 'MC:SingleAnswer', '', '', '', q.adv, {});
        opts.forEach((o,idx) => {
          push(q.block, q.id, first?q.text:'', first?'MC:SingleAnswer':'', o.text, idx+1, '', first?q.adv:{}, o.adv);
          first = false;
        });
        return;
      }
      let first = true;
      stmts.forEach(s => {
        push(q.block, q.id, first?q.text:'', 'Matrix', s.text, s.recode, 'Statement', first?q.adv:{}, s.adv);
        first = false;
      });
      scale.forEach(s => push(q.block, q.id, '', 'Matrix', s.text, s.recode, 'Scale Point', {}, s.adv));
      return;
    }
    if(q.type.startsWith('TE') && q.type !== 'TE:Form'){
      push(q.block, q.id, q.text, q.type, '', '', '', q.adv, {});
      return;
    }
    // MC:*, TE:Form, RankOrder, ConstantSum — flat option list
    const opts = q.items.filter(i=>i.role==='option');
    const isForm = q.type === 'TE:Form';
    if(!opts.length){ push(q.block, q.id, q.text, q.type, '', '', '', q.adv, {}); return; }
    let first = true;
    opts.forEach(o => {
      push(q.block, q.id, first?q.text:'', first?q.type:'', o.text, isForm?'':o.recode, '', first?q.adv:{}, o.adv);
      first = false;
    });
  });
  return rows;
}

function questionTypeLabel(type){
  const map = {
    'MC:SingleAnswer':'Single Answer', 'MC:SingleAnswer:Horizontal':'Single Answer',
    'MC:MultipleAnswer':'Multiple Answer', 'MC:MultipleAnswer:Horizontal':'Multiple Answer',
    'Matrix':'Matrix', 'TE:SingleLine':'Short Text', 'TE:Essay':'Long Text', 'TE:Form':'Form',
    'RankOrder':'Rank Order', 'ConstantSum':'Constant Sum', 'DB':'Descriptive', 'Page Break':'Page Break'
  };
  return map[type] || type;
}

function previewBody(q){
  if(q.type === 'Page Break'){
    return `<div class="preview-pagebreak">— Page break —</div>`;
  } else if(q.type === 'DB'){
    return `<div class="preview-db">${escapeHtml(q.text)}</div>`;
  } else if(q.type === 'Matrix'){
    const stmts = q.items.filter(i=>i.role==='statement');
    const scale = q.items.filter(i=>i.role==='scale');
    return `
      <div class="preview-question-text">${escapeHtml(q.text)}</div>
      <div class="preview-matrix-wrap"><table class="preview-matrix">
        <thead><tr><th></th>${scale.map(s=>`<th>${escapeHtml(s.text)}</th>`).join('')}</tr></thead>
        <tbody>${stmts.map(s=>`<tr><td>${escapeHtml(s.text)}</td>${scale.map(()=>`<td><span class="preview-radio"></span></td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`;
  } else if(q.type === 'TE:SingleLine'){
    return `<div class="preview-question-text">${escapeHtml(q.text)}</div><div class="preview-input"></div>`;
  } else if(q.type === 'TE:Essay'){
    return `<div class="preview-question-text">${escapeHtml(q.text)}</div><div class="preview-textarea"></div>`;
  } else if(q.type === 'TE:Form'){
    return `<div class="preview-question-text">${escapeHtml(q.text)}</div>
      ${q.items.map(it=>`<div class="preview-form-row"><label>${escapeHtml(it.text)}</label><div class="preview-input small"></div></div>`).join('')}`;
  } else if(q.type === 'RankOrder'){
    return `<div class="preview-question-text">${escapeHtml(q.text)}</div>
      <div class="preview-list">${q.items.filter(i=>i.role==='option').map((it,i)=>`<div class="preview-rank-item"><span class="rank-num">${i+1}</span>${escapeHtml(it.text)}</div>`).join('')}</div>`;
  } else if(q.type === 'ConstantSum'){
    return `<div class="preview-question-text">${escapeHtml(q.text)}</div>
      <div class="preview-list">${q.items.filter(i=>i.role==='option').map(it=>`<div class="preview-sum-item"><span>${escapeHtml(it.text)}</span><div class="preview-sum-box">0</div></div>`).join('')}</div>`;
  } else {
    const isMulti = q.type.startsWith('MC:MultipleAnswer');
    const horizontal = q.type.endsWith(':Horizontal');
    const opts = q.items.filter(i=>i.role==='option');
    return `
      <div class="preview-question-text">${escapeHtml(q.text)}</div>
      <div class="preview-options ${horizontal?'horizontal':''}">
        ${opts.map(o=>`<label class="preview-opt"><span class="${isMulti?'preview-check':'preview-radio'}"></span>${escapeHtml(o.text)}</label>`).join('')}
      </div>`;
  }
}

function previewCard(q){
  const optCount = q.items.filter(i=>i.role==='option' || i.role==='statement').length;
  const footer = (q.type==='DB' || q.type==='Page Break') ? '' :
    `<div class="preview-footer">${optCount} ${q.type==='Matrix'?'statement':'option'}${optCount===1?'':'s'} · ${escapeHtml(q.block)}</div>`;
  const active = q.id === activeId;
  return `
    <div class="preview-card ${active?'active':''}" data-qid="${q.id}">
      <div class="preview-head">
        <span class="preview-qid">${escapeHtml(q.id)}</span>
        <span class="preview-type">${questionTypeLabel(q.type)}</span>
        <button class="preview-edit ${active?'is-active':''}" onclick="editFromPreview('${q.id}')">${active ? ICON.check+'Editing' : 'Edit'}</button>
      </div>
      ${previewBody(q)}
      ${footer}
    </div>`;
}

function renderSurveyPreview(){
  const el = document.getElementById('surveyPreview');
  if(!el) return;
  const prevScroll = el.scrollTop;
  if(!survey.length){ el.innerHTML = '<div class="preview-empty">No questions yet.</div>'; return; }
  el.innerHTML = survey.map(q => previewCard(q)).join('');
  el.scrollTop = prevScroll;
}

function editFromPreview(qid){
  selectQ(qid);
  const card = document.querySelector('.qcard[data-qid="'+CSS.escape(qid)+'"]');
  if(card) card.scrollIntoView({block:'nearest'});
  const mainEl = document.getElementById('main');
  if(mainEl) mainEl.scrollTop = 0;
}

function downloadXlsx(cols){
  const headers = cols===15 ? HEADERS_15 : HEADERS_7;
  const widths = cols===15 ? WIDTHS_15 : WIDTHS_7;
  const sheetName = cols===15 ? 'Survey' : 'Survey Data';
  const rows = buildRows15().map(r => r.slice(0, cols));
  const aoa = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = widths.map(w => ({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const fname = `pirai_ai_survey_${cols}col_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fname);
}

// ---------- Upload Excel: parse a real Pirai AI export back into the editor ----------
function importRows(dataRows, headerRow){
  const map = {};
  headerRow.forEach((h,i) => { map[String(h||'').trim()] = i; });
  const get = (row, name) => { const i = map[name]; return i===undefined ? '' : (row[i] ?? ''); };

  const newSurvey = [];
  let current = null;

  dataRows.forEach(row => {
    const qid = String(get(row,'Question ID')||'').trim();
    if(!qid) return;
    const isNewQuestion = !current || current.id !== qid;
    const typeCell = String(get(row,'Question Type')||'').trim();

    if(isNewQuestion){
      current = {
        id: qid,
        block: String(get(row,'Block Name')||'').trim(),
        text: String(get(row,'Question Text')||'').trim(),
        type: typeCell || 'MC:SingleAnswer',
        matrixType: null,
        adv: {
          displayLogic: String(get(row,'Display Logic')||''),
          skipLogic: String(get(row,'Skip Logic')||''),
          required: String(get(row,'Required')||''),
          randomize: String(get(row,'Randomize')||'') === 'Anchor' ? '' : String(get(row,'Randomize')||''),
          defaultValue: String(get(row,'Default Value')||'')
        },
        items: []
      };
      newSurvey.push(current);
    }

    const optText = String(get(row,'Answer Option Text')||'').trim();
    if(optText){
      const matrixTypeCell = String(get(row,'Matrix Type')||'').trim();
      let role = 'option';
      if(current.type === 'Matrix') role = matrixTypeCell === 'Scale Point' ? 'scale' : 'statement';
      const recodeStr = String(get(row,'Recode Value') ?? '').trim();
      const roleItemsSoFar = current.items.filter(i=>i.role===role).length;
      const recode = current.type === 'TE:Form' ? ''
        : (recodeStr === '' ? roleItemsSoFar+1 : (isNaN(Number(recodeStr)) ? recodeStr : Number(recodeStr)));
      current.items.push({
        id:newId(), text:optText, recode, role,
        adv:{
          answerDisplayLogic: String(get(row,'Answer Display Logic')||''),
          skipLogic: isNewQuestion ? '' : String(get(row,'Skip Logic')||''),
          exclusive: String(get(row,'Exclusive')||'').toLowerCase()==='yes',
          otherText: String(get(row,'OtherText')||'').toLowerCase()==='yes',
          anchor: String(get(row,'Randomize')||'')==='Anchor'
        }
      });
    }
  });

  return newSurvey;
}

function handleExcelUpload(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
      if(!rows.length){ alert('That file looks empty.'); return; }
      const headerRow = rows[0].map(h=>String(h||'').trim());
      const imported = importRows(rows.slice(1), headerRow);
      if(!imported.length){ alert("Couldn't find any questions in this file. Make sure it's a Pirai AI 7 or 15‑column Excel export."); return; }

      survey = imported;
      activeId = survey[0].id;
      selectedItems.clear(); selectAnchor = null; broadcastOpen = false; mixOpen = false;
      manualCarveOpen = false; selectedSuggIds.clear(); broadcastTargets.clear(); mixSources.clear(); pasteDrafts = {}; suggestionCache = {};
      selectedQuestions.clear(); questionSelectAnchor = null;
      setMode(headerRow.length >= 15 ? 15 : 7);
    } catch(err){
      console.error(err);
      alert("Couldn't read this file. Make sure it's a Pirai AI 7 or 15‑column Excel export.");
    }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

function saveAll(){
  renderSurveyPreview();
  const btn = event.target;
  const orig = btn.innerHTML;
  btn.innerHTML = ICON.check + 'Saved to spec';
  setTimeout(()=>{ btn.innerHTML = orig; }, 1100);
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Resizable right panel ----------
let rightColWidth = 400;
let sidebarCollapsed = false;

function applyLayoutColumns(){
  const layout = document.getElementById('layoutGrid');
  if(!layout) return;
  const leftCol = sidebarCollapsed ? '58px' : '250px';
  layout.style.gridTemplateColumns = `${leftCol} 1fr 5px ${rightColWidth}px`;
}

function toggleSidebarPanel(){
  sidebarCollapsed = !sidebarCollapsed;
  applyLayoutColumns();
  renderSidebar();
}

function initResizer(){
  const resizer = document.getElementById('resizer');
  const layout = document.getElementById('layoutGrid');
  if(!resizer || !layout) return;
  let dragging = false;
  resizer.addEventListener('mousedown', (e) => {
    dragging = true;
    resizer.classList.add('dragging');
    layout.classList.add('no-transition');
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if(!dragging) return;
    rightColWidth = Math.min(640, Math.max(240, window.innerWidth - e.clientX));
    applyLayoutColumns();
  });
  document.addEventListener('mouseup', () => {
    if(!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    layout.classList.remove('no-transition');
    document.body.style.userSelect = '';
  });
}

function initStaticIcons(){
  const up = document.getElementById('uploadExcelBtn');
  if(up) up.innerHTML = ICON.upload + 'Upload Excel';
  const dm = document.getElementById('downloadBtnMain');
  if(dm) dm.innerHTML = ICON.download + 'Download' + ICON.chevronDown;
}

function toggleDownloadMenu(force){
  const list = document.getElementById('downloadMenuList');
  if(!list) return;
  const open = typeof force === 'boolean' ? force : !list.classList.contains('open');
  list.classList.toggle('open', open);
}

function toggleToolsMenu(force){
  toolsMenuOpen = typeof force === 'boolean' ? force : !toolsMenuOpen;
  renderSidebar();
}

document.addEventListener('click', (e) => {
  const menu = document.getElementById('downloadMenu');
  if(menu && !menu.contains(e.target)) toggleDownloadMenu(false);
  const tools = document.getElementById('toolsMenu');
  if(tools && !tools.contains(e.target) && toolsMenuOpen) toggleToolsMenu(false);
});

loadSample();
initResizer();
initStaticIcons();
applyLayoutColumns();
